{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New Movie</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <div class="container">
    <a href="{% url 'my-movies' %}" class="back-button">← Back to Movies</a>
    <h1 class="page-title">🎞️ Add a New Movie</h1>

    <form method="post" action="{% url 'movie-create' %}" class="movie-form">
      {% csrf_token %}
      
      <div class="form-group">
        <label for="name">Movie Name</label>
        <input type="text" id="name" name="name" placeholder="Enter movie name" required>
      </div>

      <div class="form-group">
        <label for="released">Release Date</label>
        <input type="date" id="released" name="released" required>
      </div>

      <div class="form-group">
        <label for="category">Category</label>
        <input type="text" id="category" name="category" placeholder="e.g. Action, Drama" required>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea name="description" id="description"></textarea>
      </div>

      <div class="form-group">
        <label for="image">Poster URL</label>
        <input type="url" id="image" name="image" placeholder="https://example.com/poster.jpg" required>
      </div>

      <button type="submit" class="add-btn">Save Movie</button>
    </form>
  </div>
</body>
</html>
