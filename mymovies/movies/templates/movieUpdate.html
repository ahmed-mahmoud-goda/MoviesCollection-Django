{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Movie - {{ movie.name }}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <div class="container">
    <a href="{% url 'my-movies' %}" class="back-button">← Back</a>

    <div class="page-header">
      <h2 class="page-title">Update Movie</h2>
    </div>

    <form method="POST" class="movie-form">
      {% csrf_token %}
      <div class="form-group">
        <label for="name">Movie Name</label>
        <input type="text" id="name" name="name" value="{{ movie.name }}" required>
      </div>

      <div class="form-group">
        <label for="released">Release Date</label>
        <input type="date" id="released" name="released" value="{{ movie.released|date:'Y-m-d' }}" required>
      </div>

      <div class="form-group">
        <label for="category">Category</label>
        <input type="text" id="category" name="category" value="{{ movie.category }}" required>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea name="description" id="description">{{movie.description}}</textarea>
      </div>


      <div class="form-group">
        <label for="image">Image URL</label>
        <input type="url" id="image" name="image" value="{{ movie.image }}" required>
      </div>

      <div class="button-group">
        <button type="submit" class="btn update-btn">Update</button>
        <a href="{% url 'my-movies' %}" class="btn delete-btn">Cancel</a>
      </div>
    </form>
  </div>
</body>
</html>
